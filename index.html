<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Akademik - SMAN 1 Jakarta</title>

    <!-- External Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-card">
            <img src="favicon.png" alt="Logo" style="width: 60px; height: 60px;">
            <h2>Portal Akademik</h2>
            <p>SMAN 1 Jakarta</p>
            <div class="login-error" id="loginError"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                <div class="form-group">
                    <label for="roleSelect">Role / Akses Sebagai</label>
                    <select id="roleSelect" required>
                        <option value="">-- Pilih Role --</option>
                        <option value="admin">Admin</option>
                        <option value="guru">Guru</option>
                        <option value="siswa">Siswa</option>
                        <option value="orang_tua">Orang Tua</option>
                    </select>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="wrapper" id="wrapper" style="display: none;">
        <!-- MOBILE HEADER -->
        <div class="mobile-header">
            <button class="mobile-toggle-btn" onclick="toggleSidebar()">
                <i class="ri-menu-line"></i>
            </button>
            <div class="mobile-brand">
                <img src="favicon.png" alt="Logo">
                <span>Portal Akademik</span>
            </div>
        </div>

        <!-- SIDEBAR OVERLAY (Mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div>
                    <div class="title">Portal Akademik</div>
                    <div class="subtitle">SMAN 1 Jakarta</div>
                </div>
                <button class="desktop-toggle-btn" onclick="toggleSidebar('desktop')">
                    <i class="ri-menu-fold-line"></i>
                </button>
            </div>

            <div class="sidebar-menu" style="height: 100%; overflow-y: auto;"></div>

            <div class="sidebar-user">
                <div class="user-info">
                    <div class="name" id="userName">User</div>
                    <div class="role" id="userRole">Role</div>
                </div>
                <button class="logout-icon-btn" onclick="handleLogout()">
                    <i class="ri-logout-box-r-line"></i>
                </button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="content-header">
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageDesc">Selamat datang di Portal Akademik SMAN 1 Jakarta</p>
            </div>

            <div id="contentArea">
                <!-- Content akan di-render di sini -->
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- Menu Access Control System -->
    <script src="js/menu-access-control.js"></script>
    <script src="js/menu-integration.js"></script>
    
    <!-- Main Application -->
    <script src="js/app.js"></script>
    <!-- ===== END SCRIPTS ===== -->

</body>
</html>
